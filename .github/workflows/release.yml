name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm --clean --distpath dist2 --workpath build2 FloatPulse.spec

      - name: 组装发布包（tools/build_release.py 白名单收集，防个人数据夹带）
        run: python tools/build_release.py

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            宣传页/FloatPulse-*-win64.zip
            宣传页/plugin-assets/*.fpplug
          generate_release_notes: true
