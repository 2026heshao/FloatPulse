name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build FloatPulse.spec

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path dist/FloatPulse/* -DestinationPath FloatPulse-win64.zip

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: FloatPulse-win64.zip
          generate_release_notes: true
